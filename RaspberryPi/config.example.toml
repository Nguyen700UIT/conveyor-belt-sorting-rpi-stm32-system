# Design reference for the future config.py loader; the current CLI does not read TOML.
# Copy to config.toml when implementing the loader. Never place API keys here.
# ROBOFLOW_API_KEY must come from the process environment.

[camera]
width = 1280
height = 720
fps = 10

[detector]
model = "tung-tran-s-workspace/ce224-project-1-yolo26n-t1"
confidence = 0.4

[crossing]
# Normalized position (0..1). Calibrate to the real camera view.
axis = "x"
position = 0.5
direction = "increasing"

[serial]
port = "/dev/ttyUSB0"
baudrate = 115200
read_timeout = 0.1
write_timeout = 1.0
transaction_timeout = 0.1
frame_timeout = 0.02
max_attempts = 3
retry_delay = 0.02
temporary_status_delay = 0.1

[sender]
queue_capacity = 16

[statistics]
database = "runtime/statistics.sqlite3"
timezone = "Asia/Bangkok"
